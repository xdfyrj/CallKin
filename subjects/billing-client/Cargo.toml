[package]
name = "billing-client"
version = "0.4.2"
edition = "2021"
description = "Blocking client for the Billing API, plus a reconciliation worker"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "reconcile"
path = "src/bin/reconcile/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
